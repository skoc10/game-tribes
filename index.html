<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boylar: Kadim Miras</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10140f; color: #f2efe4; font: 14px/1.35 system-ui, sans-serif; user-select: none; }
    #game { position: absolute; inset: 0; }
    .bar { position: absolute; left: 0; right: 0; background: rgba(20, 24, 18, .92); border: 0 solid #5b6b47; display: flex; gap: 14px; align-items: center; padding: 6px 12px; z-index: 5; }
    #topbar { top: 0; border-bottom-width: 2px; flex-wrap: wrap; }
    #panel { bottom: 0; border-top-width: 2px; min-height: 76px; flex-wrap: wrap; }
    .stat { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .grow { flex: 1; }
    button { font: inherit; color: #f2efe4; background: #3a4a2c; border: 1px solid #7d915f; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
    button:hover { background: #4d6239; }
    button.on { background: #8a6a1f; border-color: #e0b84a; }
    button.warn { background: #7a2f1f; border-color: #e0734a; }
    button small { display: block; opacity: .8; font-size: 11px; }
    #toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: rgba(120, 40, 25, .95); padding: 6px 14px; border-radius: 6px; z-index: 6; display: none; }
    #menu { position: absolute; inset: 0; z-index: 10; background: #10140f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    #menu h1 { margin: 0; font-size: 34px; }
    #menu .races { display: flex; gap: 18px; }
    #menu .race { width: 240px; text-align: left; padding: 14px; font-size: 15px; }
    #menu .race b { font-size: 19px; display: block; margin-bottom: 6px; }
    #menu .races { flex-wrap: wrap; justify-content: center; max-width: 1100px; }
    #menu .race ul { margin: 8px 0 0; padding-left: 4px; list-style: none; font-size: 13px; opacity: .9; }
    #menu .race li { margin: 3px 0; }
    #menu .tag { font-size: 11px; background: #8a6a1f; border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
    #side { position: absolute; right: 0; top: 78px; width: 300px; max-height: calc(100% - 190px); overflow: auto; background: rgba(20, 24, 18, .92); border: 2px solid #5b6b47; border-right: 0; border-radius: 8px 0 0 8px; padding: 8px 10px; z-index: 5; font-size: 13px; }
    #side h3 { margin: 8px 0 4px; font-size: 13px; opacity: .8; text-transform: uppercase; letter-spacing: .04em; }
    #side .rival { border-top: 1px solid #44523a; padding: 6px 0; }
    #side .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
    #side button { padding: 3px 7px; margin: 3px 3px 0 0; font-size: 12px; }
    #side .why { opacity: .9; margin: 3px 0; padding-left: 8px; border-left: 2px solid #8a6a1f; }
    #confirm { position: absolute; inset: 0; z-index: 9; background: rgba(8, 10, 8, .7); display: flex; align-items: center; justify-content: center; }
    #confirm > div { background: #1c2217; border: 2px solid #e0734a; border-radius: 10px; padding: 18px 22px; max-width: 420px; font-size: 16px; }
    #confirm button { margin: 14px 10px 0 0; }
    #banner { position: absolute; left: calc(50% - 150px); top: 96px; transform: translateX(-50%); max-width: calc(100% - 380px); padding: 10px 22px; border-radius: 10px; font-size: 20px; font-weight: 700; text-align: center; z-index: 7; display: none; box-shadow: 0 4px 18px rgba(0, 0, 0, .5); border: 2px solid; }
    #banner.red { background: rgba(120, 25, 20, .95); border-color: #ff6b5a; }
    #banner.green { background: rgba(22, 80, 44, .95); border-color: #4ade80; }
    #banner.gold { background: rgba(110, 80, 15, .95); border-color: #ffd24a; }
    #banner.grey { background: rgba(40, 46, 38, .95); border-color: #b9c2ab; }
    #minimap { position: absolute; left: 10px; bottom: 150px; width: 168px; height: 168px; border: 2px solid #5b6b47; border-radius: 6px; z-index: 5; background: #05070a; cursor: pointer; }
    #result { position: absolute; inset: 0; z-index: 9; background: rgba(8, 10, 8, .85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 18px; }
    #result h1 { margin: 0; font-size: 44px; }
    .help { opacity: .75; font-size: 12px; max-width: 560px; text-align: center; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="topbar" class="bar"></div>
  <div id="toast"></div>
  <div id="panel" class="bar"></div>
  <div id="side"></div>
  <div id="menu"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
